<!doctype html>
<html lang="vi" class="ledger">
  <head>
    <meta charset="UTF-8" />
    <!-- The app mark as the tab icon. 32px PNG for the tab itself, 180px for
         an iOS home-screen bookmark; the mark has alpha, so it sits on both a
         light and a dark tab strip without a plate behind it. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Design system v5 §5.1: Urbanist carries the whole UI at 300/400/500.
         Mono is a treatment for ASCII, never a default motif, and must never
         touch accented Vietnamese. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Urbanist:wght@300;400;500&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <title>Oursight</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
